services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: threatlens
      POSTGRES_PASSWORD: threatlens
      POSTGRES_DB: threatlens
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threatlens"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://threatlens:threatlens@postgres:5432/threatlens
      REDIS_URL: redis://redis:6379/0
      ELASTICSEARCH_URL: http://opensearch:9200
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      APP_URL: http://localhost:3000
      API_URL: http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://threatlens:threatlens@postgres:5432/threatlens
      REDIS_URL: redis://redis:6379/0
      ELASTICSEARCH_URL: http://opensearch:9200
    depends_on:
      - api
    command: python -m app.worker

  scheduler:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://threatlens:threatlens@postgres:5432/threatlens
      REDIS_URL: redis://redis:6379/0
      ELASTICSEARCH_URL: http://opensearch:9200
    depends_on:
      - api
    command: python -m app.scheduler

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  postgres_data:
